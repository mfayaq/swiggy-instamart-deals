name: Swiggy Instamart Keyword Deal Hunter

on:
  workflow_dispatch:
    inputs:
      skip_sync:
        description: 'Skip top-of-hour wait sync (run immediately)'
        type: boolean
        required: false
        default: false

jobs:
  plan:
    name: Plan stores
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stores: ${{ steps.stores.outputs.stores }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: List store indexes
        id: stores
        working-directory: swiggy-telegram-bot
        env:
          SWIGGY_STORE_ID: ${{ secrets.SWIGGY_STORE_ID }}
          SWIGGY_STORE_IDS: ${{ secrets.SWIGGY_STORE_IDS }}
        run: echo "stores=$(node src/store-matrix.js)" >> "$GITHUB_OUTPUT"

  hunt:
    name: Worker (${{ matrix.worker }}, store ${{ matrix.store }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        worker: [fresh, grocery, treats, munchies, beverages, personal, lifestyle, noice]
        store: ${{ fromJSON(needs.plan.outputs.stores) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'swiggy-telegram-bot/package-lock.json'

      - name: Install Dependencies
        working-directory: swiggy-telegram-bot
        run: npm ci || npm install

      - name: Restore Deal Cache
        uses: actions/cache/restore@v4
        with:
          path: swiggy-telegram-bot/data
          key: ${{ matrix.store == 0 && 'deal-cache-' || format('deal-cache-s{0}-', matrix.store) }}${{ matrix.worker }}-${{ github.run_id }}
          restore-keys: |
            ${{ matrix.store == 0 && 'deal-cache-' || format('deal-cache-s{0}-', matrix.store) }}${{ matrix.worker }}-

      - name: Run ${{ matrix.worker }} Deal Hunter
        working-directory: swiggy-telegram-bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SWIGGY_STORE_ID: ${{ secrets.SWIGGY_STORE_ID }}
          SWIGGY_PRIMARY_STORE_ID: ${{ secrets.SWIGGY_PRIMARY_STORE_ID }}
          SWIGGY_SECONDARY_STORE_ID: ${{ secrets.SWIGGY_SECONDARY_STORE_ID }}
          SWIGGY_STORE_IDS: ${{ secrets.SWIGGY_STORE_IDS }}
          SWIGGY_COOKIE: ${{ secrets.SWIGGY_COOKIE }}
          FRESH_MIN_DISCOUNT: ${{ secrets.FRESH_MIN_DISCOUNT || secrets.ESSENTIALS_MIN_DISCOUNT }}
          GROCERY_MIN_DISCOUNT: ${{ secrets.GROCERY_MIN_DISCOUNT || secrets.ESSENTIALS_MIN_DISCOUNT }}
          ESSENTIALS_MIN_DISCOUNT: ${{ secrets.ESSENTIALS_MIN_DISCOUNT }}
          TREATS_MIN_DISCOUNT: ${{ secrets.TREATS_MIN_DISCOUNT }}
          MUNCHIES_MIN_DISCOUNT: ${{ secrets.MUNCHIES_MIN_DISCOUNT || secrets.TREATS_MIN_DISCOUNT }}
          LIFESTYLE_MIN_DISCOUNT: ${{ secrets.LIFESTYLE_MIN_DISCOUNT }}
          BEVERAGES_MIN_DISCOUNT: ${{ secrets.BEVERAGES_MIN_DISCOUNT }}
          PERSONAL_MIN_DISCOUNT: ${{ secrets.PERSONAL_MIN_DISCOUNT }}
          USE_BROWSER: 'true'
          SKIP_SYNC: ${{ inputs.skip_sync }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          EXTRA_FLAGS=""
          if [ "$SKIP_SYNC" = "true" ]; then
            EXTRA_FLAGS="--skip-sync"
          fi
          echo "Executing Deal Hunter Worker: ${{ matrix.worker }}..."
          node src/cron-runner.js ${{ matrix.worker }} --store ${{ matrix.store }} $EXTRA_FLAGS

      - name: Save Deal Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: swiggy-telegram-bot/data
          key: ${{ matrix.store == 0 && 'deal-cache-' || format('deal-cache-s{0}-', matrix.store) }}${{ matrix.worker }}-${{ github.run_id }}
