name: Swiggy Instamart Keyword Deal Hunter

on:
  workflow_dispatch:
    inputs:
      skip_sync:
        description: 'Skip top-of-hour wait sync (run immediately)'
        type: boolean
        required: false
        default: false

# One run at a time. A run started while another is going waits in the queue
# (GitHub keeps one waiting run; a newer waiting run replaces the older one).
concurrency:
  group: swiggy-hunter
  cancel-in-progress: false

jobs:
  plan:
    name: Plan stores
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      count: ${{ steps.stores.outputs.count }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: List store indexes
        id: stores
        working-directory: swiggy-telegram-bot
        env:
          SWIGGY_STORE_ID: ${{ secrets.SWIGGY_STORE_ID }}
          SWIGGY_STORE_IDS: ${{ secrets.SWIGGY_STORE_IDS }}
        run: |
          STORES=$(node src/store-matrix.js)
          COUNT=$(node -e 'console.log(JSON.parse(process.argv[1]).length)' "$STORES")
          if [ "$COUNT" -gt 3 ]; then
            echo "::warning::$COUNT stores configured, only the first 3 are run"
          fi
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

  # Stores run one after another so Telegram alerts arrive Home first, then the
  # next store. Each store runs its 8 workers in parallel (see hunt-store.yml).
  # always() keeps a later store running when an earlier one failed.
  store0:
    name: Store 0
    needs: plan
    if: ${{ needs.plan.result == 'success' && fromJSON(needs.plan.outputs.count) > 0 }}
    uses: ./.github/workflows/hunt-store.yml
    with:
      store: 0
      skip_sync: ${{ inputs.skip_sync }}
    secrets: inherit

  store1:
    name: Store 1
    needs: [plan, store0]
    if: ${{ always() && needs.plan.result == 'success' && fromJSON(needs.plan.outputs.count) > 1 }}
    uses: ./.github/workflows/hunt-store.yml
    with:
      store: 1
      skip_sync: ${{ inputs.skip_sync }}
    secrets: inherit

  store2:
    name: Store 2
    needs: [plan, store1]
    if: ${{ always() && needs.plan.result == 'success' && fromJSON(needs.plan.outputs.count) > 2 }}
    uses: ./.github/workflows/hunt-store.yml
    with:
      store: 2
      skip_sync: ${{ inputs.skip_sync }}
    secrets: inherit
